name: Publish E2E Base Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: E2E base image tag to publish.
        required: true
        default: php8.2-node22-panel1.12.2

permissions:
  contents: read
  packages: write

env:
  E2E_BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/notur-e2e-base:${{ inputs.tag }}

jobs:
  publish:
    name: Publish E2E Base Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish E2E base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/e2e/Dockerfile.base
          push: true
          tags: ${{ env.E2E_BASE_IMAGE }}
          cache-from: type=gha,scope=e2e-base
          cache-to: type=gha,scope=e2e-base,mode=max
