name: CI

on:
  push:
    branches: [master, dev]
    paths:
      - 'src/**'
      - 'bridge/**'
      - 'sdk/**'
      - 'tests/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/**'
      - 'examples/**'
      - 'extensions/**'
      - 'installer/tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'phpunit.xml'
      - '.github/workflows/ci.yml'
      - '.github/security/**'
      - 'installer/patches/**'
      - 'scripts/ci/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'bridge/**'
      - 'sdk/**'
      - 'tests/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/**'
      - 'examples/**'
      - 'extensions/**'
      - 'installer/tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'phpunit.xml'
      - '.github/workflows/ci.yml'
      - '.github/security/**'
      - 'installer/patches/**'
      - 'scripts/ci/**'

jobs:
  php-unit-tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} Unit Tests (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '10', dependencies: 'lowest-laravel10' }
          - { php: '8.2', laravel: '12', dependencies: 'locked' }
          - { php: '8.3', laravel: '10', dependencies: 'latest-laravel10' }
          - { php: '8.3', laravel: '12', dependencies: 'locked' }
          - { php: '8.4', laravel: '12', dependencies: 'locked' }
          - { php: '8.5', laravel: '12', dependencies: 'locked' }
          - { php: '8.3', laravel: '11', dependencies: 'latest-laravel11' }

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mbstring, json
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.dependencies }}-

      - name: Install Composer dependencies
        run: bash scripts/ci/install-php-dependencies.sh "${{ matrix.dependencies }}"

      - name: Run unit tests
        run: ./vendor/bin/phpunit --testsuite Unit

  php-integration-tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.database.type }} Integration (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '10', dependencies: 'lowest-laravel10', database: { type: 'mysql', image: 'mysql:8.4', healthcheck: 'mysqladmin ping -h 127.0.0.1 -u root -ptesting' } }
          - { php: '8.4', laravel: '12', dependencies: 'locked', database: { type: 'mysql', image: 'mysql:8.4', healthcheck: 'mysqladmin ping -h 127.0.0.1 -u root -ptesting' } }
          - { php: '8.4', laravel: '12', dependencies: 'locked', database: { type: 'mariadb', image: 'mariadb:11.4', healthcheck: 'healthcheck.sh --connect --innodb_initialized' } }

    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: notur_test
          MYSQL_USER: notur
          MYSQL_PASSWORD: notur
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_DATABASE: notur_test
          MARIADB_USER: notur
          MARIADB_PASSWORD: notur
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.healthcheck }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mbstring, json, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.dependencies }}-

      - name: Install Composer dependencies
        run: bash scripts/ci/install-php-dependencies.sh "${{ matrix.dependencies }}"

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -ptesting --silent 2>/dev/null && break
            sleep 2
          done

      - name: Run integration tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: notur_test
          DB_USERNAME: notur
          DB_PASSWORD: notur
        run: ./vendor/bin/phpunit --testsuite Integration

  frontend-build:
    name: Frontend Build (Node 24)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Build hello-world example
        working-directory: examples/hello-world
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build and audit bundled extensions
        run: |
          for directory in examples/full-extension sdk/examples/red-button extensions/cs2-modframework; do
            npm ci --prefix "$directory" --no-fund
            npm run build --prefix "$directory"
            npm audit --prefix "$directory"
          done
          npm audit --prefix examples/hello-world

      - name: Run installer regression checks
        run: |
          for script in installer/tests/test-*.sh; do
            case "$script" in *patch-roundtrip*) continue ;; esac
            bash "$script"
          done

      - name: Run frontend tests
        run: npm run test:frontend

  security-audit:
    name: Security Audit Policies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, mbstring, json
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run composer audit and enforce allowlist policy
        run: |
          composer audit --format=json > composer-audit.json || true
          php scripts/ci/check-composer-audit.php composer-audit.json .github/security/composer-audit-allowlist.json

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Run npm audit and enforce allowlist policy
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json || true
          node scripts/ci/check-npm-audit.js npm-audit.json .github/security/npm-audit-allowlist.json

  patch-validation:
    name: Validate Patches (${{ matrix.panel-tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        panel-tag: [v1.12.0, v1.12.1, v1.12.2, v1.15.0, v1.15.1]

    steps:
      - uses: actions/checkout@v7

      # The round-trip script is the authoritative correctness gate: it
      # clones the panel tag, applies forward+reverse patches, and verifies
      # zero warnings, no .orig files left behind, and an empty `diff -rq`
      # against pristine source. This is stricter than `patch --dry-run`.
      - name: Run patch round-trip verifier (${{ matrix.panel-tag }})
        run: bash installer/tests/test-patch-roundtrip.sh ${{ matrix.panel-tag }}
