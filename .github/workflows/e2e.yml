name: E2E Tests

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'bridge/**'
      - 'sdk/**'
      - 'installer/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'examples/**'
      - 'docker/**'
      - 'tests/E2E/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'bridge/**'
      - 'sdk/**'
      - 'installer/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'examples/**'
      - 'docker/**'
      - 'tests/E2E/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/e2e/Dockerfile.base
          load: true
          tags: notur/e2e-base:php8.2-node22-panel1.12.2
          cache-from: type=gha,scope=e2e-base
          cache-to: type=gha,scope=e2e-base,mode=max

      - name: Build E2E app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/e2e/Dockerfile
          target: app
          load: true
          tags: notur/e2e-app:ci
          build-args: |
            E2E_BASE_IMAGE=notur/e2e-base:php8.2-node22-panel1.12.2
          cache-from: type=gha,scope=e2e-app
          cache-to: type=gha,scope=e2e-app,mode=max

      - name: Build E2E test-runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/e2e/Dockerfile
          target: test-runner
          load: true
          tags: notur/e2e-test-runner:ci
          build-args: |
            E2E_BASE_IMAGE=notur/e2e-base:php8.2-node22-panel1.12.2
          cache-from: type=gha,scope=e2e-test-runner
          cache-to: type=gha,scope=e2e-test-runner,mode=max

      - name: Run shell and browser E2E tests
        env:
          E2E_APP_IMAGE: notur/e2e-app:ci
          E2E_TEST_RUNNER_IMAGE: notur/e2e-test-runner:ci
          E2E_BASE_IMAGE: notur/e2e-base:php8.2-node22-panel1.12.2
        run: bash docker/e2e/run-e2e.sh --no-build --keep

      - name: Reset E2E containers before install/uninstall suite
        run: |
          cd docker/e2e
          docker compose down -v --remove-orphans 2>/dev/null || true

      - name: Run install/uninstall E2E tests
        env:
          E2E_APP_IMAGE: notur/e2e-app:ci
          E2E_TEST_RUNNER_IMAGE: notur/e2e-test-runner:ci
          E2E_BASE_IMAGE: notur/e2e-base:php8.2-node22-panel1.12.2
        run: bash docker/e2e/run-e2e.sh --no-build --suite install-uninstall --keep

      - name: Collect logs on failure
        if: failure()
        run: |
          cd docker/e2e
          docker compose logs app > /tmp/app-logs.txt 2>&1 || true
          docker compose logs db > /tmp/db-logs.txt 2>&1 || true
          docker compose logs test-runner > /tmp/test-runner-logs.txt 2>&1 || true

          docker compose exec -T app bash -c '
            echo "=== laravel.log (last 200 lines) ==="
            tail -n 200 /var/www/pterodactyl/storage/logs/laravel.log 2>/dev/null || echo "(missing)"
            echo
            echo "=== nginx error.log ==="
            tail -n 100 /var/log/nginx/error.log 2>/dev/null || echo "(missing)"
            echo
            echo "=== php-fpm error log ==="
            tail -n 100 /var/log/php-fpm.log 2>/dev/null \
              || tail -n 100 /var/log/php8.2-fpm.log 2>/dev/null \
              || echo "(no fpm log file — fpm logs to stderr by default)"
            echo
            echo "=== .env (with secrets redacted) ==="
            sed -E "s/(APP_KEY|HASHIDS_SALT|DB_PASSWORD|MAIL_PASSWORD|RECAPTCHA_SECRET_KEY)=.*/\1=***REDACTED***/" /var/www/pterodactyl/.env 2>/dev/null || echo "(missing)"
            echo
            echo "=== extensions.json ==="
            cat /var/www/pterodactyl/notur/extensions.json 2>/dev/null || echo "(missing)"
          ' > /tmp/runtime-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/*-logs.txt
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          cd docker/e2e
          docker compose down -v --remove-orphans 2>/dev/null || true
