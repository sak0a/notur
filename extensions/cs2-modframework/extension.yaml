notur: "1.0"
id: "notur/cs2-modframework"
name: "CS2 Mod Frameworks"
version: "1.1.3"
description: "One-click install of SwiftlyS2, CounterStrikeSharp & Metamod for CS2 servers"
authors:
  - name: "Notur Team"
license: "MIT"

requires:
  notur: "^1.0"
  pterodactyl: "^1.11"
  php: "^8.2"

autoload:
  psr-4:
    'Notur\Cs2Modframework\': "src/"

backend:
  routes:
    api-client: "src/routes/api-client.php"
  permissions:
    - "cs2-modframework.manage"

frontend:
  bundle: "resources/frontend/dist/cs2-modframework.js"

health:
  checks:
    - id: "frontend_bundle"
      label: "Frontend bundle"
      description: "Verifies the compiled CS2 Mod Frameworks frontend bundle exists and is readable."
      severity: "critical"
    - id: "api_routes"
      label: "API routes"
      description: "Verifies the extension API route file is present."
      severity: "critical"
    - id: "pterodactyl_runtime"
      label: "Pterodactyl runtime"
      description: "Verifies required Pterodactyl server and Wings repository classes are available."
      severity: "critical"
    - id: "cache_store"
      label: "Cache store"
      description: "Verifies Laravel cache is available for framework version lookups."
      severity: "warning"
    - id: "manifest_contract"
      label: "Manifest contract"
      description: "Verifies required permission, route, and frontend declarations are present."
      severity: "warning"
