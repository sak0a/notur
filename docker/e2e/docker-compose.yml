services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: notur_e2e
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: pterodactyl
    ports:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pnotur_e2e"]
      interval: 5s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql
    networks:
      - e2e

  app:
    image: ${E2E_APP_IMAGE:-notur/e2e-app:local}
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile
      target: app
      args:
        E2E_BASE_IMAGE: ${E2E_BASE_IMAGE:-notur/e2e-base:php8.2-node22-panel1.12.2}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_URL: http://app
      NODE_OPTIONS: --openssl-legacy-provider
      # APP_KEY is generated at Docker build time (php artisan key:generate in Dockerfile)
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: pterodactyl
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      RECAPTCHA_ENABLED: "false"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/auth/login >/dev/null || curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    networks:
      - e2e

  test-runner:
    image: ${E2E_TEST_RUNNER_IMAGE:-notur/e2e-test-runner:local}
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile
      target: test-runner
      args:
        E2E_BASE_IMAGE: ${E2E_BASE_IMAGE:-notur/e2e-base:php8.2-node22-panel1.12.2}
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://127.0.0.1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: pterodactyl
      NODE_OPTIONS: --openssl-legacy-provider
      E2E_SUITE: all
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: notur-admin-password
      E2E_USER_EMAIL: user@example.com
      E2E_USER_USERNAME: user
      E2E_USER_PASSWORD: notur-user-password
    entrypoint: ["bash", "/opt/notur/tests/E2E/run-tests.sh"]
    shm_size: 1gb
    network_mode: "service:app"

networks:
  e2e:
    driver: bridge
